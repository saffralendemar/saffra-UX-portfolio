<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CookieMonster – Saffra Lendemar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Work+Sans:wght@400;500&family=Quicksand:wght@400;500;600;700&family=Inter:wght@400&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
html, body { margin: 0; background: #ffffff; color: oklch(0.145 0 0); }
a { color: inherit; } a:hover { color: inherit; }
.scaled-import [data-name="Header Start"], .scaled-import [data-name="Header Other"], .scaled-import [data-name="Hero Section"] { display: none !important; }
button, a, [data-name="Button"], [data-name="Lable"], [data-name="Icon Button"], [data-name="Back Button"], [role="button"] { cursor: pointer !important; }
[data-name="Icon Button"] { transition: opacity 0.18s ease; }
[data-name="Icon Button"]:hover { opacity: 0.75; }
[data-name="Navigation"] [data-name="Button"]::after, [data-name="CookieMonster Card"] [data-name="Button"]::after, [data-name="Ommej Card"] [data-name="Button"]::after, [data-name="Matt Movilidad Card"] [data-name="Button"]::after { content: ''; position: absolute; inset: 0; border-radius: 12px; background: rgba(0,0,0,0); transition: background 0.18s ease; pointer-events: none; }
[data-name="Navigation"] [data-name="Button"]:hover::after { background: rgba(0,0,0,0.10); }
[data-name="Navigation"] [data-name="Button"]:active::after { background: rgba(0,0,0,0.20); }
[data-name="CookieMonster Card"] [data-name="Button"]:hover::after, [data-name="Ommej Card"] [data-name="Button"]:hover::after, [data-name="Matt Movilidad Card"] [data-name="Button"]:hover::after { background: rgba(0,0,0,0.12); }
[data-name="Lable"] { transition: opacity 0.18s ease; }
[data-name="Lable"]:hover { opacity: 0.6; }
[data-name="CookieMonster Card"], [data-name="Ommej Card"], [data-name="Matt Movilidad Card"] { cursor: pointer !important; transition: transform 0.22s ease, box-shadow 0.22s ease; }
[data-name="CookieMonster Card"]:hover, [data-name="Ommej Card"]:hover, [data-name="Matt Movilidad Card"]:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.12); }
[data-name="Button"] > * { z-index: 1; }
[data-name="Button"]::after { z-index: 0; }
[data-name="Global Header"] [data-name="Button"]::after { content: ''; position: absolute; inset: 0; border-radius: 12px; background: rgba(0,0,0,0); transition: background 0.18s ease; pointer-events: none; }
[data-name="Global Header"] [data-name="Button"]:hover::after { background: rgba(0,0,0,0.10); }
[data-name="Global Header"] [data-name="Button"]:active::after { background: rgba(0,0,0,0.20); }
</style>
</helmet>
<header data-name="Global Header" style="position: fixed; top: 0; left: 0; right: 0; height: 93px; z-index: 1000; backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px); background-color: {{ headerBg }}; transition: background-color 0.25s ease;">
  <div style="width: 100%; height: 100%; padding: 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between;">
      <a href="Portfolio.dc.html" aria-label="Saffra Lendemar – home" style="display: flex; align-items: center; gap: 8px; flex-shrink: 0; text-decoration: none; padding: 0;">
        <div style="display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 36.423px; height: 36.423px;">
          <div style="transform: rotate(45deg);">
            <div style="width: 19.667px; height: 31.842px; position: relative;">
              <div style="position: absolute; top: 0.94px; left: 0.94px; width: 17.794px; height: 21.775px; display: flex; align-items: center; justify-content: center;">
                <div style="transform: rotate(180deg);">
                  <svg width="19.794" height="23.477" viewBox="0 0 19.7942 23.4769" fill="none" style="display: block;"><path d="M13.175 4.68269C13.175 4.68269 18.7942 9.43463 18.7942 13.5798C18.7942 18.4935 14.8109 22.4769 9.89711 22.4769C4.98337 22.4769 1 18.4935 1 13.5798C1 10.3019 2.87308 8.89711 2.87308 8.89711L4.04375 7.96057" stroke="{{ ink }}" stroke-linecap="round" stroke-width="2" style="transition: stroke 0.25s ease;"></path><circle cx="10.1312" cy="1.63894" r="1.63894" fill="{{ ink }}" style="transition: fill 0.25s ease;"></circle></svg>
                </div>
              </div>
              <div style="position: absolute; top: 8.9px; left: 0.94px; width: 17.794px; height: 21.775px;">
                <svg width="19.794" height="23.477" viewBox="0 0 19.7942 23.4769" fill="none" style="display: block;"><path d="M13.175 4.68269C13.175 4.68269 18.7942 9.43463 18.7942 13.5798C18.7942 18.4935 14.8109 22.4769 9.89711 22.4769C4.98337 22.4769 1 18.4935 1 13.5798C1 10.3019 2.87308 8.89711 2.87308 8.89711L4.04375 7.96057" stroke="{{ ink }}" stroke-linecap="round" stroke-width="2" style="transition: stroke 0.25s ease;"></path><circle cx="10.1312" cy="1.63894" r="1.63894" fill="{{ ink }}" style="transition: fill 0.25s ease;"></circle></svg>
              </div>
            </div>
          </div>
        </div>
        <div style="width: 0; height: 31px; border-left: 1.23px solid {{ ink }}; transition: border-color 0.25s ease;"></div>
        <span style="font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 18px; line-height: 1.5; color: {{ ink }}; white-space: nowrap; transition: color 0.25s ease;">Saffra Lendemar</span>
      </a>
      <nav data-name="Navigation" class="hidden md:flex" style="align-items: center; gap: 32px;">
        <div style="display: flex; align-items: center; gap: 32px;">
          <button onClick="{{ goProjects }}" data-name="Lable" style="font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.5; color: {{ projectsColor }}; background: none; border: none; padding: 0; white-space: nowrap; transition: color 0.25s ease, opacity 0.18s ease;">Projects</button>
          <button onClick="{{ goAbout }}" data-name="Lable" style="font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.5; color: {{ aboutColor }}; background: none; border: none; padding: 0; white-space: nowrap; transition: color 0.25s ease, opacity 0.18s ease;">About</button>
          <a href="https://drive.google.com/file/d/1QsPoNtUWVdZXhQ-covbn8mKZ0hATkZTM/view?usp=sharing" target="_blank" rel="noreferrer" data-name="Lable" style="font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.5; color: {{ labelInk }}; text-decoration: none; white-space: nowrap; transition: color 0.25s ease, opacity 0.18s ease;">Resume</a>
        </div>
        <button onClick="{{ goContact }}" data-name="Button" style="position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 12px; flex-shrink: 0; height: 45px; padding: 9px 18px; box-sizing: border-box; background: {{ btnBg }}; border: none; cursor: pointer; transition: background-color 0.25s ease;">
          <span style="position: relative; font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.5; text-align: center; color: {{ btnInk }}; white-space: nowrap; transition: color 0.25s ease;">Contact me</span>
        </button>
      </nav>
      <button class="flex md:hidden" onClick="{{ toggleMenu }}" aria-label="Open menu" aria-expanded="{{ menuOpen }}" style="flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 44px; height: 44px; border-radius: 12px; background: {{ btnBg }}; border: none; padding: 0; cursor: pointer;">
        <span style="display: block; width: 18px; height: 1.5px; background: {{ btnInk }}; border-radius: 1px;"></span>
        <span style="display: block; width: 18px; height: 1.5px; background: {{ btnInk }}; border-radius: 1px;"></span>
        <span style="display: block; width: 18px; height: 1.5px; background: {{ btnInk }}; border-radius: 1px;"></span>
      </button>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div class="md:hidden" style="position: absolute; top: 93px; left: 0; right: 0; background-color: {{ menuBg }}; backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px);">
      <div style="display: flex; flex-direction: column; gap: 20px; padding: 24px 24px 28px;">
        <button onClick="{{ goProjects }}" data-name="Lable" style="text-align: left; font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.5; color: {{ projectsColor }}; background: none; border: none; padding: 0;">Projects</button>
        <button onClick="{{ goAbout }}" data-name="Lable" style="text-align: left; font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.5; color: {{ aboutColor }}; background: none; border: none; padding: 0;">About</button>
        <a href="https://drive.google.com/file/d/1QsPoNtUWVdZXhQ-covbn8mKZ0hATkZTM/view?usp=sharing" target="_blank" rel="noreferrer" data-name="Lable" style="font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.5; color: {{ labelInk }}; text-decoration: none;">Resume</a>
        <button onClick="{{ goContact }}" data-name="Button" style="position: relative; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 12px; flex-shrink: 0; height: 45px; padding: 9px 18px; box-sizing: border-box; background: {{ btnBg }}; border: none; cursor: pointer; transition: background-color 0.25s ease; align-self: flex-start;">
          <span style="position: relative; font-family: 'Poppins', sans-serif; font-weight: 500; font-size: 14px; line-height: 1.5; text-align: center; color: {{ btnInk }}; white-space: nowrap; transition: color 0.25s ease;">Contact me</span>
        </button>
      </div>
    </div>
  </sc-if>
</header>
<main data-screen-label="Case study" style="padding-top: max(0px, calc(109px - min(100px, 6.9444vw)));">
  <x-import component-from-global-scope="CookieMonsterCase" from="./lib/CookieMonsterCase.jsx" home-href="Portfolio.dc.html" hint-size="100%,9000px" style="display: block; width: 100%;"></x-import>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { menuOpen: false, dark: false };
  headerColors(dark, active) {
    const ink = '#000000', labelInk = '#494949';
    return {
      ink, labelInk,
      headerBg: 'rgba(255,255,255,0.01)',
      menuBg: 'rgba(255,255,255,0.92)',
      btnBorder: '#313131',
      btnBg: dark ? '#4A4A4A' : 'rgba(0,72,127,0.4)',
      btnInk: '#ffffff',
      projectsColor: active === 'projects' ? ink : labelInk,
      aboutColor: active === 'about' ? ink : labelInk,
    };
  }
  isPastHero(selectors) {
    for (const sel of selectors) {
      const el = document.querySelector(sel);
      if (el && el.offsetParent !== null) return el.getBoundingClientRect().bottom <= 93;
    }
    return window.scrollY > 0;
  }
  componentDidMount() {
    this.onScroll = () => {
      const dark = this.isPastHero(['[data-name="Hero"]', '[data-name="Ommej Card"]']);
      if (dark !== this.state.dark) this.setState({ dark });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
  }
  componentWillUnmount() { window.removeEventListener('scroll', this.onScroll); }
  goToStart(section) {
    sessionStorage.setItem('scrollTo', section);
    window.location.href = 'Portfolio.dc.html';
  }
  renderVals() {
    return {
      menuOpen: this.state.menuOpen,
      ...this.headerColors(true, 'projects'),
      goProjects: () => this.goToStart('Projects'),
      goAbout: () => this.goToStart('About'),
      goContact: () => this.goToStart('Contact section'),
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
    };
  }
}
</script>
</body>
</html>
